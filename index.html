<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0">
  <title>Student QR Attendance</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com"
    crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Battambang:wght@400;700&family=Kantumruy+Pro:ital,wght@0,100..700;1,100..700&display=swap"
    rel="stylesheet"
  >
  <link rel="stylesheet" href="style.css">
</head>

<body>
<div class="page-wrapper">

  <!-- Language switch -->
  <div class="language-area">
    <button id="languageButton"
      class="language-button">
      ខ្មែរ
    </button>
  </div>

  <!-- Header -->
  <header class="header">
    <div class="header-icon">🏫</div>
    <h1 data-i18n="title"></h1>
    <p data-i18n="subtitle"></p>
  </header>

  <!-- Session status banner -->
  <div class="session-banner" id="sessionBanner"
    style="display:none;">
    <span id="sessionBannerIcon">📋</span>
    <span id="sessionBannerText"></span>
  </div>

  <!-- Location status box -->
  <div class="location-box" id="locationBox">
    <div class="location-icon">📍</div>
    <div class="location-text">
      <p id="locationStatus"
        data-i18n="requestingLocation"></p>
      <p class="location-reason"
        data-i18n="locationReason"></p>
    </div>
  </div>

  <!-- Distance status box -->
  <div class="distance-box" id="distanceBox"
    style="display:none;">
    <div class="distance-icon"
      id="distanceIcon">📏</div>
    <div class="distance-text">
      <p id="distanceStatus"></p>
    </div>
  </div>

  <!-- Attendance form -->
  <main class="form-card" id="formCard">

    <h2 class="form-title"
      data-i18n="formTitle"></h2>

    <form id="attendanceForm" novalidate>

      <!-- Full name -->
      <div class="form-group">
        <label for="fullName">
          <span data-i18n="fullNameLabel"></span>
          <span class="required">*</span>
        </label>
        <input
          type="text"
          id="fullName"
          data-i18n-placeholder="fullNamePlaceholder"
        >
        <span class="field-error"
          id="nameError"></span>
      </div>

      <!-- Age -->
      <div class="form-group">
        <label for="age">
          <span data-i18n="ageLabel"></span>
          <span class="required">*</span>
        </label>
        <input
          type="number"
          id="age"
          data-i18n-placeholder="agePlaceholder"
          min="5"
          max="100"
        >
        <span class="field-error"
          id="ageError"></span>
      </div>

      <!-- Grade -->
      <div class="form-group">
        <label for="grade">
          <span data-i18n="gradeLabel"></span>
          <span class="required">*</span>
        </label>
        <input
          type="text"
          id="grade"
          data-i18n-placeholder="gradePlaceholder"
        >
        <span class="field-error"
          id="gradeError"></span>
      </div>

      <!-- Location consent -->
      <div class="form-group checkbox-group"
        id="consentGroup">
        <label class="checkbox-label">
          <input type="checkbox"
            id="locationConsent">
          <span class="checkbox-custom"></span>
          <span class="checkbox-text"
            data-i18n="locationConsentText"></span>
        </label>
        <span class="field-error"
          id="locationError"></span>
      </div>

      <!-- Submit -->
      <button
        type="submit"
        class="submit-btn"
        id="submitBtn"
        data-i18n="submitButton"
      ></button>

    </form>
  </main>

  <!-- Session closed card -->
  <div class="session-closed-card"
    id="sessionClosedCard"
    style="display:none;">
    <div style="font-size:48px;">🔒</div>
    <h2 data-i18n="sessionClosedTitle"></h2>
    <p data-i18n="sessionClosedMsg"></p>
  </div>

  <!-- Success card -->
  <section class="success-card" id="successCard">
    <div class="success-icon">✅</div>
    <h2 class="success-title"
      data-i18n="successTitle"></h2>
    <p class="success-message"
      data-i18n="successMessage"></p>
    <div class="success-details"
      id="successDetails"></div>
  </section>

  <!-- Error card -->
  <section class="error-card" id="errorCard">
    <div class="error-icon">❌</div>
    <p class="error-message"
      id="errorMessage"></p>
  </section>

  <!-- Loading overlay -->
  <div class="loading-overlay" id="loadingOverlay">
    <div class="loading-spinner"></div>
    <p class="loading-text"
      data-i18n="savingText"></p>
  </div>

  <!-- Footer -->
  <footer class="footer">
    <p data-i18n="footerSecurity"></p>
    <p data-i18n="footerSchool"></p>
  </footer>

</div>

<script type="module" src="script.js"></script>
</body>
</html>
