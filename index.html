<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0">
  <title>Student QR Attendance</title>

  <link rel="preconnect"
    href="https://fonts.googleapis.com">
  <link rel="preconnect"
    href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Battambang:wght@400;700&family=Kantumruy+Pro:ital,wght@0,100..700;1,100..700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>
<div class="page-wrapper">

  <!-- ======================================
       LANGUAGE SWITCH — top right
       ====================================== -->
  <div class="language-area">
    <button id="languageButton"
      class="language-button">
      ខ្មែរ
    </button>
  </div>

  <!-- ======================================
       HEADER
       Logo on left, title beside it
       ====================================== -->
  <header class="header">

    <!-- ✅ Logo + title row -->
    <div class="header-top">

      <!-- School logo -->
      <img
        src="school-logo.png"
        alt="School Logo"
        class="school-logo"
      >

      <!-- Title text group -->
      <div class="header-title-group">
        <h1 data-i18n="title">
          QR Attendance System
        </h1>
        <p data-i18n="subtitle">
          Tepranom High School
        </p>
      </div>

    </div>
  </header>

  <!-- ======================================
       SESSION STATUS BANNER
       ====================================== -->
  <div class="session-banner"
    id="sessionBanner"
    style="display:none;">
    <span id="sessionBannerIcon">📋</span>
    <span id="sessionBannerText"></span>
  </div>

  <!-- ======================================
       LOCATION STATUS BOX
       ====================================== -->
  <div class="location-box" id="locationBox">
    <div class="location-icon">📍</div>
    <div class="location-text">
      <p id="locationStatus"
        data-i18n="requestingLocation"></p>
      <p class="location-reason"
        data-i18n="locationReason"></p>
    </div>
  </div>

  <!-- ======================================
       DISTANCE STATUS BOX
       ====================================== -->
  <div class="distance-box" id="distanceBox"
    style="display:none;">
    <div class="distance-icon"
      id="distanceIcon">📏</div>
    <div class="distance-text">
      <p id="distanceStatus"></p>
      <p id="distanceDetail"
        style="font-size:12px;
               color:#64748b;
               margin-top:4px;"></p>
    </div>
    <button id="retryLocationBtn"
      style="display:none;
             margin-top:10px;
             padding:8px 18px;
             background:#3b82f6;
             color:white;
             border:none;
             border-radius:8px;
             font-size:13px;
             cursor:pointer;
             font-family:
               'Kantumruy Pro',
               'Poppins', sans-serif;"
      data-i18n="retryLocation">
      Check Location Again
    </button>
  </div>

  <!-- ======================================
       ATTENDANCE FORM
       ====================================== -->
  <main class="form-card" id="formCard">

    <h2 class="form-title"
      data-i18n="formTitle"></h2>

    <form id="attendanceForm" novalidate>

      <!-- Student ID -->
      <div class="form-group">
        <label for="studentId">
          <span data-i18n="studentIdLabel">
          </span>
          <span class="required">*</span>
        </label>
        <input
          type="text"
          id="studentId"
          data-i18n-placeholder=
            "studentIdPlaceholder"
        >
        <span class="field-error"
          id="studentIdError"></span>
      </div>

      <!-- Full name -->
      <div class="form-group">
        <label for="fullName">
          <span data-i18n="fullNameLabel">
          </span>
          <span class="required">*</span>
        </label>
        <input
          type="text"
          id="fullName"
          data-i18n-placeholder=
            "fullNamePlaceholder"
        >
        <span class="field-error"
          id="nameError"></span>
      </div>

      <!-- Age -->
      <div class="form-group">
        <label for="age">
          <span data-i18n="ageLabel"></span>
          <span class="required">*</span>
        </label>
        <input
          type="number"
          id="age"
          data-i18n-placeholder="agePlaceholder"
          min="5"
          max="100"
        >
        <span class="field-error"
          id="ageError"></span>
      </div>

      <!-- Grade -->
      <div class="form-group">
        <label for="grade">
          <span data-i18n="gradeLabel"></span>
          <span class="required">*</span>
        </label>
        <input
          type="text"
          id="grade"
          data-i18n-placeholder=
            "gradePlaceholder"
        >
        <span class="field-error"
          id="gradeError"></span>
      </div>

      <!-- Submit button -->
      <button
        type="submit"
        class="submit-btn"
        id="submitBtn"
        disabled
        data-i18n="submitButton">
      </button>

    </form>
  </main>

  <!-- ======================================
       SESSION CLOSED CARD
       ====================================== -->
  <div class="session-closed-card"
    id="sessionClosedCard"
    style="display:none;">
    <div style="font-size:48px;">🔒</div>
    <h2 data-i18n="sessionClosedTitle"></h2>
    <p data-i18n="sessionClosedMsg"></p>
  </div>

  <!-- ======================================
       SUCCESS CARD
       ====================================== -->
  <section class="success-card"
    id="successCard"
    style="display:none;">
    <div class="success-icon">✅</div>
    <h2 class="success-title"
      data-i18n="successTitle"></h2>
    <p class="success-message"
      data-i18n="successMessage"></p>
    <div class="success-details"
      id="successDetails"></div>
  </section>

  <!-- ======================================
       ERROR CARD
       ====================================== -->
  <section class="error-card"
    id="errorCard"
    style="display:none;">
    <div class="error-icon">❌</div>
    <p class="error-message"
      id="errorMessage"></p>
  </section>

  <!-- ======================================
       LOADING OVERLAY
       ====================================== -->
  <div class="loading-overlay"
    id="loadingOverlay"
    style="display:none;">
    <div class="loading-spinner"></div>
    <p class="loading-text"
      data-i18n="savingText"></p>
  </div>

  <!-- ======================================
       FOOTER
       ====================================== -->
  <footer class="footer">
    <p data-i18n="footerSecurity"></p>
    <p data-i18n="footerSchool"></p>
  </footer>

</div>

<script type="module" src="script.js"></script>
</body>
</html>
