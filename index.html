<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width,
             initial-scale=1.0">
  <title>Student QR Attendance</title>

  <link rel="preconnect"
    href="https://fonts.googleapis.com">
  <link rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Battambang:wght@400;700&family=Kantumruy+Pro:ital,wght@0,100..700;1,100..700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>
<div class="page-wrapper">

  <!-- LANGUAGE SWITCH -->
  <div class="language-area">
    <button id="languageButton"
      class="language-button">
      ខ្មែរ
    </button>
  </div>

  <!-- HEADER -->
  <header class="header">
    <div class="header-top">
      <img
        src="school-logo.png"
        alt="School Logo"
        class="school-logo">
      <div class="header-title-group">
        <h1 data-i18n="title">
          QR Attendance System
        </h1>
        <p data-i18n="subtitle">
          Tepranom High School
        </p>
      </div>
    </div>
  </header>

  <!-- SESSION STATUS BANNER -->
  <div class="session-banner"
    id="sessionBanner"
    style="display:none;">
    <span id="sessionBannerIcon">📋</span>
    <span id="sessionBannerText"></span>
  </div>

  <!-- MODE BANNER -->
  <div id="modeBanner"
    style="display:none;
           padding:10px 18px;
           border-radius:10px;
           margin:10px auto;
           max-width:480px;
           text-align:center;
           font-size:14px;
           font-weight:700;">
    <span id="modeBannerIcon"></span>
    <span id="modeBannerText"
      data-i18n="modeBannerCheckIn">
    </span>
  </div>

  <!-- LOCATION STATUS BOX -->
  <div class="location-box" id="locationBox">
    <div class="location-icon">📍</div>
    <div class="location-text">
      <p id="locationStatus"
        data-i18n="requestingLocation"></p>
      <p class="location-reason"
        data-i18n="locationReason"></p>
    </div>
  </div>

  <!-- DISTANCE STATUS BOX -->
  <div class="distance-box" id="distanceBox"
    style="display:none;">
    <div class="distance-icon"
      id="distanceIcon">📏</div>
    <div class="distance-text">
      <p id="distanceStatus"></p>
      <p id="distanceDetail"
        style="font-size:12px;
               color:#64748b;
               margin-top:4px;"></p>
    </div>
    <button id="retryLocationBtn"
      style="display:none;
             margin-top:10px;
             padding:8px 18px;
             background:#3b82f6;
             color:white;
             border:none;
             border-radius:8px;
             font-size:13px;
             cursor:pointer;
             font-family:inherit;"
      data-i18n="retryLocation">
      Check Location Again
    </button>
  </div>

  <!-- ATTENDANCE FORM -->
  <main class="form-card" id="formCard">

    <h2 class="form-title"
      data-i18n="formTitle"></h2>

    <form id="attendanceForm" novalidate>

      <!-- Student ID -->
      <div class="form-group">
        <label for="studentId">
          <span data-i18n="studentIdLabel">
          </span>
          <span class="required">*</span>
        </label>
        <input
          type="text"
          id="studentId"
          data-i18n-placeholder=
            "studentIdPlaceholder">
        <span class="field-error"
          id="studentIdError"></span>
      </div>

      <!-- Full name — READ ONLY -->
      <div class="form-group">
        <label for="fullName">
          <span data-i18n="fullNameLabel">
          </span>
        </label>
        <input
          type="text"
          id="fullName"
          readonly
          data-i18n-placeholder=
            "fullNamePlaceholder"
          style="background:#f1f5f9;
                 cursor:not-allowed;
                 color:#64748b;">
      </div>

      <!-- ✅ CHANGED: Age → Sex — READ ONLY -->
      <div class="form-group">
        <label for="sex">
          <span data-i18n="sexLabel"></span>
        </label>
        <input
          type="text"
          id="sex"
          readonly
          data-i18n-placeholder="sexPlaceholder"
          style="background:#f1f5f9;
                 cursor:not-allowed;
                 color:#64748b;">
      </div>

      <!-- Grade — READ ONLY -->
      <div class="form-group">
        <label for="grade">
          <span data-i18n="gradeLabel"></span>
        </label>
        <input
          type="text"
          id="grade"
          readonly
          data-i18n-placeholder=
            "gradePlaceholder"
          style="background:#f1f5f9;
                 cursor:not-allowed;
                 color:#64748b;">
      </div>

      <!-- Auto-fill message -->
      <p id="autoFillMsg"
        style="font-size:12px;
               color:#16a34a;
               font-weight:600;
               margin-top:-10px;
               margin-bottom:12px;
               display:none;"></p>

      <!-- Submit button -->
      <button
        type="submit"
        class="submit-btn"
        id="submitBtn"
        disabled
        data-i18n="submitButton">
      </button>

    </form>
  </main>

  <!-- CHECK OUT CARD -->
  <div class="checkout-card"
    id="checkoutCard"
    style="display:none;">

    <div class="checkout-header">
      <div style="font-size:36px;">✅</div>
      <h2 data-i18n="checkedInTitle">
        Checked In
      </h2>
      <p id="checkoutStudentName"
        style="font-size:14px;
               color:#166534;
               margin-top:4px;
               font-weight:600;"></p>
    </div>

    <div class="checkout-info-box">
      <div class="checkout-info-row">
        <span data-i18n="checkInTimeLabel">
          Check In Time
        </span>
        <strong id="displayCheckInTime">
          --
        </strong>
      </div>
      <div class="checkout-info-row">
        <span data-i18n="checkOutTimeLabel">
          Check Out Time
        </span>
        <strong id="displayCheckOutTime"
          data-i18n="notCheckedOut">
          Not Checked Out
        </strong>
      </div>
      <div class="checkout-info-row">
        <span data-i18n="statusLabel">
          Status
        </span>
        <strong id="displayStatus"
          style="color:#16a34a;"
          data-i18n="present">
          Present
        </strong>
      </div>
    </div>

    <button
      id="checkOutBtn"
      class="checkout-btn"
      data-i18n="checkOutButton">
      Check Out
    </button>

    <p id="alreadyCheckedOutMsg"
      style="display:none;
             text-align:center;
             color:#16a34a;
             font-size:14px;
             font-weight:600;
             margin-top:12px;"
      data-i18n="alreadyCheckedOutMsg">
    </p>

  </div>

  <!-- NOT CHECKED IN CARD -->
  <div id="notCheckedInCard"
    style="display:none;
           background:#fef3c7;
           border:2px solid #fcd34d;
           border-radius:16px;
           padding:32px 24px;
           text-align:center;
           max-width:480px;
           margin:20px auto;">
    <div style="font-size:48px;
                margin-bottom:12px;">
      ⚠️
    </div>
    <h2 style="color:#92400e;
               font-size:20px;
               margin-bottom:8px;"
      data-i18n="notCheckedInTitle">
      Not Checked In Yet
    </h2>
    <p style="color:#78350f;
              font-size:14px;"
      data-i18n="notCheckedInMsg">
      You must check in before you can check out.
    </p>
  </div>

  <!-- SESSION CLOSED CARD -->
  <div class="session-closed-card"
    id="sessionClosedCard"
    style="display:none;">
    <div style="font-size:48px;">🔒</div>
    <h2 data-i18n="sessionClosedTitle"></h2>
    <p data-i18n="sessionClosedMsg"></p>
  </div>

  <!-- SUCCESS CARD -->
  <section class="success-card"
    id="successCard"
    style="display:none;">
    <div class="success-icon">✅</div>
    <h2 class="success-title"
      data-i18n="successTitle"></h2>
    <p class="success-message"
      data-i18n="successMessage"></p>
    <div class="success-details"
      id="successDetails"></div>
  </section>

  <!-- ERROR CARD -->
  <section class="error-card"
    id="errorCard"
    style="display:none;">
    <div class="error-icon">❌</div>
    <p class="error-message"
      id="errorMessage"></p>
  </section>

  <!-- LOADING OVERLAY -->
  <div class="loading-overlay"
    id="loadingOverlay"
    style="display:none;">
    <div class="loading-spinner"></div>
    <p class="loading-text"
      data-i18n="savingText"></p>
  </div>

  <!-- FOOTER -->
  <footer class="footer">
    <p data-i18n="footerSecurity"></p>
    <p data-i18n="footerSchool"></p>
  </footer>

</div>

<script type="module" src="script.js"></script>
</body>
</html>
